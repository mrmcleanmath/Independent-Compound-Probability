<script>
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const state={view:"practice",mode:"regular",current:null,evaluated:false,correct:0,incorrect:0,lastTemplate:{regular:"",advanced:""},worksheetLastTemplate:{regular:"",advanced:""}};

const SIMPLE_PROBS = [
{num:1,den:2},
{num:1,den:3},
{num:2,den:3},
{num:1,den:4},
{num:3,den:4},
{num:1,den:5},
{num:2,den:5},
{num:3,den:5},
{num:4,den:5}
];

const DECIMAL_PROBS = [0.6,0.7,0.8];

function gcd(a,b){
a = Math.round(a);
b = Math.round(b);
while(b){ [a,b] = [b, a % b]; }
return Math.abs(a);
}

function simplify(n,d){
if(d === 0) return {num:n, den:d};
if(n === 0) return {num:0, den:1};
const g = gcd(Math.abs(n), Math.abs(d));
n /= g;
d /= g;
if(d < 0){ n *= -1; d *= -1; }
return {num:n, den:d};
}

function frac(n,d){ return simplify(n,d); }
function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
function valueOf(x){ return typeof x === 'number' ? x : x.num / x.den; }
function fracText(f){ return `${f.num}/${f.den}`; }
function trimNum(n){ return Number(n).toFixed(6).replace(/0+$/,'').replace(/\.$/,''); }
function fmtPct(x){ return `${trimNum(valueOf(x) * 100)}%`; }
function approxEqual(a,b){ return Math.abs(a-b) <= 0.0005; }
function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr){
const a = arr.slice();
for(let i=a.length-1;i>0;i--){
const j = Math.floor(Math.random() * (i+1));
[a[i],a[j]] = [a[j],a[i]];
}
return a;
}

function isNiceFraction(f){
if(typeof f === 'number') return true;
return f.den <= 625;
}

function multiply(a,b){
if(typeof a === 'number' || typeof b === 'number') return valueOf(a) * valueOf(b);
return simplify(a.num*b.num, a.den*b.den);
}

function power(x,n){
if(typeof x === 'number') return Math.pow(x,n);
return simplify(Math.pow(x.num,n), Math.pow(x.den,n));
}

function toDisplay(x){
if(typeof x === 'number'){
return `${trimNum(x)} = ${fmtPct(x)}`;
}
return `${fracText(x)} = ${trimNum(valueOf(x))} = ${fmtPct(x)}`;
}

function parseAnswer(str){
  if(str == null) return null;
  let s = String(str).trim().replace(/\s+/g,'');
  if(!s) return null;
  if(s.includes(',') && s.includes('.')) return null;
  if(s.includes(',')) s = s.replace(',','.');

  if(s.includes('/')){
    const parts=s.split('/');
    if(parts.length!==2) return null;
    if(!/^[+]?\d+$/.test(parts[0]) || !/^[+]?\d+$/.test(parts[1])) return null;
    const n=Number(parts[0]), d=Number(parts[1]);
    if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||d===0) return null;
    const value=n/d;
    if(value<0||value>1) return null;
    return {value};
  }

  if(s.endsWith('%')){
    const body=s.slice(0,-1);
    if(!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(body)) return null;
    const n=Number(body);
    if(!Number.isFinite(n)||n<0||n>100) return null;
    return {value:n/100};
  }

  if(!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)) return null;
  const n=Number(s);
  if(!Number.isFinite(n)||n<0) return null;
  if(n<=1) return {value:n};
  if(n<=100) return {value:n/100};
  return null;
}

function randomRegularProb(){
return clone(pick(SIMPLE_PROBS.filter(p => p.den <= 5)));
}

function randomFractionPair(){
let p = randomRegularProb();
let q = randomRegularProb();
let tries = 0;
while((valueOf(p) === valueOf(q) || !isNiceFraction(multiply(p,q))) && tries < 20){
q = randomRegularProb();
tries++;
}
return [clone(p), clone(q)];
}

function randomFractionTriple(){
let p = randomRegularProb();
let q = randomRegularProb();
let r = randomRegularProb();
let tries = 0;
while((!isNiceFraction(multiply(multiply(p,q),r))) && tries < 30){
p = randomRegularProb();
q = randomRegularProb();
r = randomRegularProb();
tries++;
}
return [clone(p), clone(q), clone(r)];
}

function randomFractionQuad(){
let p = randomRegularProb();
let q = randomRegularProb();
let r = randomRegularProb();
let s = randomRegularProb();
let tries = 0;
while((!isNiceFraction(multiply(multiply(multiply(p,q),r),s))) && tries < 40){
p = randomRegularProb();
q = randomRegularProb();
r = randomRegularProb();
s = randomRegularProb();
tries++;
}
return [clone(p), clone(q), clone(r), clone(s)];
}

function probText(x){
return typeof x === 'number' ? trimNum(x) : fracText(x);
}

function modeLabel(mode){ return mode === 'regular' ? 'Regular' : 'Advanced'; }

function singleChanceContext(kind, p, labelA, labelB){
const other = p.den - p.num;
if(kind === 'spinner') return `A spinner is divided into ${p.den} equal parts. ${p.num} part${p.num===1?'':'s'} ${p.num===1?'is':'are'} ${labelA} and ${other} part${other===1?'':'s'} ${other===1?'is':'are'} ${labelB}.`;
if(kind === 'bag') return `A bag contains ${p.num} ${labelA} and ${other} ${labelB}. One item is chosen and then put back before the next item is chosen.`;
if(kind === 'cards') return `A pile has ${p.num} ${labelA} cards and ${other} ${labelB} cards. One card is taken, replaced, and then another card is taken.`;
return `Out of ${p.den} equal outcomes, ${p.num} are ${labelA} and ${other} are ${labelB}.`;
}

function makeQuestion(data){
data.answered = false;
return data;
}

function genR1(){
const [p,q] = randomFractionPair();
const contexts = [
['spinner',
`Spinner A is divided into ${p.den} equal parts. ${p.num} part${p.num===1?'':'s'} ${p.num===1?'is':'are'} red. Spinner B is divided into ${q.den} equal parts. ${q.num} part${q.num===1?'':'s'} ${q.num===1?'is':'are'} blue.`,
'landing on red on Spinner A first, and then blue on Spinner B second'],
['bag',
`Bag A contains ${p.num} yellow counter${p.num===1?'':'s'} and ${p.den-p.num} green counter${p.den-p.num===1?'':'s'}. Bag B contains ${q.num} blue counter${q.num===1?'':'s'} and ${q.den-q.num} black counter${q.den-q.num===1?'':'s'}. One counter is chosen from each bag.`,
'getting a yellow counter from Bag A first, and then a blue counter from Bag B second'],
['cards',
`Pile A has ${p.num} star card${p.num===1?'':'s'} and ${p.den-p.num} circle card${p.den-p.num===1?'':'s'}. Pile B has ${q.num} triangle card${q.num===1?'':'s'} and ${q.den-q.num} square card${q.den-q.num===1?'':'s'}. One card is taken from each pile.`,
'getting a star card from Pile A first, and then a triangle card from Pile B second']
];
const c = pick(contexts);
const ans = multiply(p,q);
return makeQuestion({
template:'R1',
mode:'regular',
context:c[0],
structure:'2 events in order',
operation:'Multiply',
scenario:c[1],
question:`What is the probability of ${c[2]}?`,
answer:ans,
explanation:`Multiply the two independent probabilities: ${probText(p)} x ${probText(q)} = ${toDisplay(ans)}.`
});
}

function genR2(){
const p = randomRegularProb();
const contexts = [
['coin',`A biased coin is flipped two times. The probability of heads on each flip is ${probText(p)}.`,'getting heads both times'],
['spinner',`${singleChanceContext('spinner', p, 'green', 'yellow')} It is spun two times.`,'landing on green both times'],
['bag',`${singleChanceContext('bag', p, 'red ball', 'blue ball')}`,'getting a red ball both times']
];
const c = pick(contexts);
const ans = multiply(p,p);
return makeQuestion({
template:'R2',
mode:'regular',
context:c[0],
structure:'same event twice',
operation:'Multiply',
scenario:c[1],
question:`What is the probability of ${c[2]}?`,
answer:ans,
explanation:`Because the events are independent, multiply the probability by itself: ${probText(p)} x ${probText(p)} = ${toDisplay(ans)}.`
});
}

function genR3(){
const p = randomRegularProb();
const q = randomRegularProb();
const contexts = [
['coin',`A biased coin is flipped first. The probability of heads is ${probText(p)}. Then a spinner is spun. The probability of landing on red is ${probText(q)}.`,'getting heads first, and then landing on red'],
['bag',`${singleChanceContext('bag', p, 'white counter', 'black counter')} Then a spinner is spun, and the probability of landing on blue is ${probText(q)}.`,'getting a white counter first, and then landing on blue'],
['cards',`${singleChanceContext('cards', p, 'star', 'circle')} Then a biased coin is flipped, and the probability of heads is ${probText(q)}.`,'getting a star card first, and then getting heads']
];
const c = pick(contexts);
const ans = multiply(p,q);
return makeQuestion({
template:'R3',
mode:'regular',
context:c[0],
structure:'2 different events in order',
operation:'Multiply',
scenario:c[1],
question:`What is the probability of ${c[2]}?`,
answer:ans,
explanation:`Multiply the two independent probabilities in order: ${probText(p)} x ${probText(q)} = ${toDisplay(ans)}.`
});
}

function genR4(){
const p = pick(DECIMAL_PROBS);
let q = pick(DECIMAL_PROBS);
let tries = 0;
while(q === p && tries < 10){ q = pick(DECIMAL_PROBS); tries++; }
const contexts = [
['players',`Annika hits the target ${Math.round(p*10)} out of 10 times and Lorena hits the target ${Math.round(q*10)} out of 10 times.`,'both hit the target'],
['machines',`Machine A works ${Math.round(p*10)} out of 10 times and Machine B works ${Math.round(q*10)} out of 10 times.`,'both machines work'],
['tickets',`Ticket A wins ${Math.round(p*10)} out of 10 times and Ticket B wins ${Math.round(q*10)} out of 10 times.`,'both tickets win']
];
const c = pick(contexts);
const ans = +(p*q).toFixed(4);
return makeQuestion({
template:'R4',
mode:'regular',
context:c[0],
structure:'2 different independent objects',
operation:'Multiply',
scenario:c[1],
question:`What is the probability that ${c[2]}?`,
answer:ans,
explanation:`Multiply the independent probabilities: ${trimNum(p)} x ${trimNum(q)} = ${toDisplay(ans)}.`
});
}

function genR5(){
const choices = [
['die','A fair die is rolled two times. The probability of an even number on one roll is 1/2.','getting even both times',frac(1,4),'Multiply 1/2 x 1/2 = 1/4.'],
['die','A fair die is rolled two times. The probability of a number greater than 4 on one roll is 1/3.','getting a number greater than 4 on both rolls',frac(1,9),'Multiply 1/3 x 1/3 = 1/9.'],
['die','A fair die is rolled two times. The probability of getting a 6 on one roll is 1/6.','getting a 6 on both rolls',frac(1,36),'Multiply 1/6 x 1/6 = 1/36.']
];
const c = pick(choices);
return makeQuestion({
template:'R5',
mode:'regular',
context:c[0],
structure:'grouped die outcomes',
operation:'Multiply',
scenario:c[1],
question:`What is the probability of ${c[2]}?`,
answer:c[3],
explanation:c[4]
});
}

function genA1(){
const p = clone(pick([frac(1,2),frac(1,3),frac(2,3),frac(1,4),frac(3,4),frac(2,5),frac(3,5)]));
const contexts = [
['spinner',`${singleChanceContext('spinner', p, 'red', 'green')} It is spun 3 times.`,'landing on red all 3 times'],
['bag',`${singleChanceContext('bag', p, 'blue marble', 'yellow marble')} Three marbles are chosen with replacement.`, 'getting a blue marble all 3 times'],
['coin',`A biased coin is flipped 3 times. The probability of heads on each flip is ${probText(p)}.`,'getting heads all 3 times']
];
const c = pick(contexts);
const ans = multiply(multiply(p,p),p);
return makeQuestion({
template:'A1',
mode:'advanced',
context:c[0],
structure:'3 events in order',
operation:'Multiply',
scenario:c[1],
question:`What is the probability of ${c[2]}?`,
answer:ans,
explanation:`Multiply the probability 3 times: ${probText(p)} x ${probText(p)} x ${probText(p)} = ${toDisplay(ans)}.`
});
}

function genA2(){
const [p,q,r] = randomFractionTriple();
const contexts = [
['spinner',
`Spinner A is divided into ${p.den} equal parts, and ${p.num} parts are red. Spinner B is divided into ${q.den} equal parts, and ${q.num} parts are blue. Spinner C is divided into ${r.den} equal parts, and ${r.num} parts are yellow.`,
'landing on red first, then blue, and then yellow'],
['bags',
`Bag A contains ${p.num} white counter${p.num===1?'':'s'} and ${p.den-p.num} black counter${p.den-p.num===1?'':'s'}. Bag B contains ${q.num} green counter${q.num===1?'':'s'} and ${q.den-q.num} orange counter${q.den-q.num===1?'':'s'}. Bag C contains ${r.num} star counter${r.num===1?'':'s'} and ${r.den-r.num} plain counter${r.den-r.num===1?'':'s'}. One counter is chosen from each bag.`,
'getting a white counter first, then a green counter, and then a star counter'],
['mixed',
`A biased coin is flipped first, and the probability of heads is ${probText(p)}. Then a spinner is spun, and the probability of landing on blue is ${probText(q)}. Then a bag is used, and the probability of getting a red counter is ${probText(r)}.`,
'getting heads first, then blue, and then a red counter']
];
const c = pick(contexts);
const ans = multiply(multiply(p,q),r);
return makeQuestion({
template:'A2',
mode:'advanced',
context:c[0],
structure:'3 different events in order',
operation:'Multiply',
scenario:c[1],
question:`What is the probability of ${c[2]}?`,
answer:ans,
explanation:`Multiply the 3 independent probabilities in order: ${probText(p)} x ${probText(q)} x ${probText(r)} = ${toDisplay(ans)}.`
});
}

function genA3(){
const p = clone(pick([frac(1,2),frac(1,3),frac(2,3),frac(1,4),frac(3,4),frac(2,5),frac(3,5)]));
const q = clone(pick([frac(1,2),frac(1,3),frac(2,3),frac(1,4),frac(3,4),frac(2,5),frac(3,5)]));
const contexts = [
['sports',`Player A scores ${p.num} out of ${p.den} shots on average. Player A shoots twice, and then Player B shoots once. Player B scores ${q.num} out of ${q.den} shots on average.`, 'Player A scoring on the first two shots and Player B scoring on the last shot'],
['spinner',`Spinner A is divided into ${p.den} equal parts, and ${p.num} parts are red. Spinner B is divided into ${q.den} equal parts, and ${q.num} parts are blue. Spinner A is spun twice, then Spinner B is spun once.`, 'landing on red on the first two spins and blue on the last spin'],
['games',`A team wins a home game ${p.num} out of ${p.den} times on average and wins an away game ${q.num} out of ${q.den} times on average. The team plays 2 home games and then 1 away game.`, 'winning both home games and then the away game']
];
const c = pick(contexts);
const ans = multiply(multiply(p,p), q);
return makeQuestion({
template:'A3',
mode:'advanced',
context:c[0],
structure:'repeated event then new event',
operation:'Multiply',
scenario:c[1],
question:`What is the probability of ${c[2]}?`,
answer:ans,
explanation:`Multiply all 3 independent probabilities: ${probText(p)} x ${probText(p)} x ${probText(q)} = ${toDisplay(ans)}.`
});
}

function genA4(){
const forms = shuffle([
{type:'decimal', value:0.8, text:'0.8'},
{type:'fraction', value:3/5, text:'3/5'},
{type:'percent', value:0.7, text:'70%'}
]);
const ans = +(forms[0].value * forms[1].value * forms[2].value).toFixed(6);
return makeQuestion({
template:'A4',
mode:'advanced',
context:'mixed formats',
structure:'3 events with mixed number formats',
operation:'Multiply',
scenario:`A player scores on ${forms[0].text} of shots on average, a spinner lands on red with probability ${forms[1].text}, and a ticket wins with probability ${forms[2].text}.`,
question:'What is the probability that all 3 events happen?',
answer:ans,
explanation:`Convert if needed, then multiply: ${forms[0].text} x ${forms[1].text} x ${forms[2].text} = ${toDisplay(ans)}.`
});
}

function genA5(){
const [p,q,r,s] = randomFractionQuad();
const contexts = [
['spinners',
`Spinner A lands on red with probability ${probText(p)}. Spinner B lands on blue with probability ${probText(q)}. Spinner C lands on yellow with probability ${probText(r)}. Spinner D lands on green with probability ${probText(s)}.`,
'landing on red first, then blue, then yellow, and then green'],
['mixed',
`A biased coin is flipped first, and the probability of heads is ${probText(p)}. Then a fair-style spinner lands on blue with probability ${probText(q)}. Then a bag gives a white counter with probability ${probText(r)}. Then a ticket wins with probability ${probText(s)}.`,
'getting heads first, then blue, then a white counter, and then a win'],
['sports',
`A player makes the first shot with probability ${probText(p)}, the second shot with probability ${probText(q)}, the third shot with probability ${probText(r)}, and the fourth shot with probability ${probText(s)}.`,
'making all 4 shots']
];
const c = pick(contexts);
const ans = multiply(multiply(multiply(p,q),r),s);
return makeQuestion({
template:'A5',
mode:'advanced',
context:c[0],
structure:'4 events in order',
operation:'Multiply',
scenario:c[1],
question:`What is the probability of ${c[2]}?`,
answer:ans,
explanation:`Multiply the 4 independent probabilities in order: ${probText(p)} x ${probText(q)} x ${probText(r)} x ${probText(s)} = ${toDisplay(ans)}.`
});
}

const GENERATORS = {
regular:[genR1,genR2,genR3,genR4,genR5],
advanced:[genA1,genA2,genA3,genA4,genA5]
};

function drawQuestion(mode, worksheet=false){
const lastKey = worksheet ? 'worksheetLastTemplate' : 'lastTemplate';
const last = state[lastKey][mode];
const gens = shuffle(GENERATORS[mode]);
let q = null;
for(const gen of gens){
const candidate = gen();
if(candidate.template !== last){
q = candidate;
break;
}
if(!q) q = candidate;
}
state[lastKey][mode] = q.template;
return q;
}



function newQuestion(){
state.current=drawQuestion(state.mode,false);state.evaluated=false;
$("#scenario").textContent=state.current.scenario;$("#question").textContent=state.current.question;
$("#answer").value="";$("#answer").disabled=false;$("#check").disabled=false;$("#next").hidden=true;
$("#feedback").textContent="";$("#feedback").className="feedback";$("#answerKey").textContent="";
$("#showSteps").hidden=true;$("#steps").hidden=true;$("#steps").textContent="";$("#answer").focus();
}

function checkAnswer(){
if(state.evaluated||!state.current)return;
const raw=$("#answer").value.trim();
if(!raw){$("#feedback").textContent="Enter an answer first.";$("#feedback").className="feedback warn";return}
const parsed=parseAnswer(raw);
if(!parsed){$("#feedback").textContent="Use a valid fraction, decimal, or percentage.";$("#feedback").className="feedback warn";return}
state.evaluated=true;$("#answer").disabled=true;$("#check").disabled=true;$("#next").hidden=false;
const actual=valueOf(state.current.answer);
if(approxEqual(parsed.value,actual)){
state.correct++;$("#feedback").textContent="Correct!";$("#feedback").className="feedback correct";
}else{
state.incorrect++;$("#feedback").textContent="Incorrect.";$("#feedback").className="feedback incorrect";
$("#answerKey").textContent="Correct answer: "+toDisplay(state.current.answer);$("#showSteps").hidden=false;
}
$("#correctCount").textContent=state.correct;$("#incorrectCount").textContent=state.incorrect;
}

$("#check").addEventListener("click",checkAnswer);
$("#next").addEventListener("click",newQuestion);
$("#showSteps").addEventListener("click",()=>{$("#steps").textContent=state.current.explanation;$("#steps").hidden=false;$("#showSteps").hidden=true});
$("#answer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();state.evaluated?newQuestion():checkAnswer()}else if(e.key==="Escape"&&!state.evaluated)$("#answer").value=""});

$("#mathModes").addEventListener("click",e=>{
const b=e.target.closest("button[data-mode]");if(!b)return;
state.mode=b.dataset.mode;$$("#mathModes button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
if(state.view==="practice")newQuestion();
});
$("#contrastBtn").addEventListener("click",()=>{const on=document.body.classList.toggle("high-contrast");$("#contrastBtn").setAttribute("aria-pressed",String(on))});

function setView(view){
state.view=view;const p=view==="practice";
$("#practice").style.display=p?"grid":"none";$("#worksheet").style.display=p?"none":"block";
$("#practiceBtn").setAttribute("aria-pressed",String(p));$("#worksheetBtn").setAttribute("aria-pressed",String(!p));
if(p)newQuestion();else if(!$("#wsList").children.length)renderWorksheet();
}
$("#practiceBtn").addEventListener("click",()=>setView("practice"));
$("#worksheetBtn").addEventListener("click",()=>setView("worksheet"));

function renderWorksheet(){
const list=$("#wsList");list.innerHTML="";const count=Number($("#wsCount").value)||10;
state.worksheetLastTemplate[state.mode]="";
for(let i=1;i<=count;i++){
const q=drawQuestion(state.mode,true);
const item=document.createElement("div");item.className="ws-item";
item.innerHTML=`<div class="ws-q"><strong>${i}.</strong> ${q.scenario}<br><br><strong>${q.question}</strong></div>
<div style="margin-top:8px">Answer: ______________________________</div>
<button class="ws-reveal" aria-expanded="false">Reveal</button>
<div class="ws-answer">Answer: ${toDisplay(q.answer)}</div>
<div class="ws-steps">${q.explanation}</div>`;
const b=item.querySelector(".ws-reveal"),a=item.querySelector(".ws-answer"),s=item.querySelector(".ws-steps");
b.addEventListener("click",()=>{const showing=a.style.display==="block";a.style.display=showing?"none":"block";s.style.display=showing?"none":"block";b.textContent=showing?"Reveal":"Hide";b.setAttribute("aria-expanded",String(!showing))});
list.appendChild(item);
}
}
$("#generateWs").addEventListener("click",renderWorksheet);
$("#revealAll").addEventListener("click",()=>{$$("#wsList .ws-answer,#wsList .ws-steps").forEach(x=>x.style.display="block");$$("#wsList .ws-reveal").forEach(b=>{b.textContent="Hide";b.setAttribute("aria-expanded","true")})});
$("#hideAll").addEventListener("click",()=>{$$("#wsList .ws-answer,#wsList .ws-steps").forEach(x=>x.style.display="none");$$("#wsList .ws-reveal").forEach(b=>{b.textContent="Reveal";b.setAttribute("aria-expanded","false")})});
$("#printWs").addEventListener("click",()=>window.print());

function runDevTests(){
const fails=[];const assert=(n,c)=>{if(!c)fails.push(n)};
assert("fraction",parseAnswer("3/5")&&approxEqual(parseAnswer("3/5").value,.6));
assert("decimal",parseAnswer("0.6")&&approxEqual(parseAnswer("0.6").value,.6));
assert("percent",parseAnswer("60%")&&approxEqual(parseAnswer("60%").value,.6));
assert("whole percent",parseAnswer("60")&&approxEqual(parseAnswer("60").value,.6));
assert("comma decimal",parseAnswer("0,6")&&approxEqual(parseAnswer("0,6").value,.6));
assert("blank rejected",parseAnswer("")===null);
assert("hex rejected",parseAnswer("0x10")===null);
assert("scientific rejected",parseAnswer("6e-1")===null);
assert("0.26 rejected for .25",!approxEqual(.26,.25));
assert("0.333 accepted for 1/3",approxEqual(.333,1/3));
for(let i=0;i<20000;i++)for(const mode of ["regular","advanced"]){
const q=drawQuestion(mode,false),v=valueOf(q.answer);
assert(mode+" finite",Number.isFinite(v));assert(mode+" range",v>=0&&v<=1);
assert(mode+" multiply",q.operation==="Multiply");
assert(mode+" scenario",typeof q.scenario==="string"&&q.scenario.length>10);
assert(mode+" question",typeof q.question==="string"&&q.question.length>10);
assert(mode+" explanation",typeof q.explanation==="string"&&q.explanation.length>10);
}
console.log(fails.length?"DEV TESTS: FAIL":"DEV TESTS: PASS",fails);
}
newQuestion();
if(new URLSearchParams(location.search).get("dev")==="1")runDevTests();
</script>
</body>
</html>
